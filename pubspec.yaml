name: museujl
description: "Museu José Leonilson — Acervo digital do artista brasileiro"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  go_router: ^14.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/acervo.json
    - assets/design/
    - assets/fotos_familia/
    - assets/imagens_obras/DEC.70/
    - assets/imagens_obras/DEC.80/
    - assets/imagens_obras/DEC.90/
